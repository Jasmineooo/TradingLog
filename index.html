<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efeadf">
  <meta name="description" content="守则｜以原则交易的交易纪律日志。记录计划、执行、偏离与复盘，不记流水账。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="守则">
  <title>守则 · 交易纪律日志</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%234a241f'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' fill='%23e9cfa6' font-family='serif'%3E守%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">守</div>
        <div>
          <h1>守则</h1>
          <p>TRADING DISCIPLINE</p>
        </div>
      </div>
      <span class="local-pill"><i></i>仅存本机</span>
    </header>

    <main id="view-log" class="view active" aria-label="交易日志"></main>
    <main id="view-stats" class="view" aria-label="统计复盘"></main>
    <main id="view-principles" class="view" aria-label="交易原则"></main>
    <main id="view-settings" class="view" aria-label="设置"></main>
  </div>

  <nav class="bottom-nav" aria-label="主导航">
    <button class="nav-item active" data-tab="log" aria-label="日志">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h14v15H5z"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></svg>
      <span>日志</span>
    </button>
    <button class="nav-item" data-tab="stats" aria-label="统计">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5h16"/><path d="M7 16V9M12 16V5M17 16v-4"/></svg>
      <span>复盘</span>
    </button>
    <button class="nav-fab" data-action="new-plan" aria-label="新建交易计划">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="nav-item" data-tab="principles" aria-label="交易原则">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 19 6v5.2c0 4.4-2.9 7.6-7 9.3-4.1-1.7-7-4.9-7-9.3V6z"/><path d="m9 12 2 2 4-4"/></svg>
      <span>原则</span>
    </button>
    <button class="nav-item" data-tab="settings" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span>设置</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
    <div class="sheet-grab"></div>
    <div class="sheet-top">
      <button class="icon-btn" data-action="close-sheet" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
      <div class="sheet-title">
        <h2 id="sheet-title">交易计划</h2>
        <p id="sheet-subtitle"></p>
      </div>
      <div class="sheet-step" id="sheet-step"></div>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
    <div class="sheet-footer" id="sheet-footer"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog class="confirm-dialog" id="confirm-dialog">
    <div class="confirm-inner">
      <h3 id="confirm-title">确认</h3>
      <p id="confirm-desc"></p>
      <div class="confirm-actions">
        <button class="btn" data-action="confirm-cancel">取消</button>
        <button class="btn primary" id="confirm-ok" data-action="confirm-ok">确认</button>
      </div>
    </div>
  </dialog>

  <input type="file" id="import-input" accept=".json,application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
